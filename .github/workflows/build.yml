name: Build addon zip

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (leave empty for a test build)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          pip install lupa
          python tests/run_tests.py

      - name: Build zip
        id: build
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          ./scripts/package.sh "$VERSION"
          echo "zip=dist/GoonerJourneys-${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Every build: download the zip from the Actions run page.
      - uses: actions/upload-artifact@v4
        with:
          name: GoonerJourneys
          path: ${{ steps.build.outputs.zip }}

      # Publish a GitHub Release with the zip when a v* tag is pushed, or when
      # the workflow is run by hand (Actions tab -> Run workflow) with a version.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.version }}
          name: The Gooner Journeys v${{ steps.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.build.outputs.zip }}
          generate_release_notes: true
